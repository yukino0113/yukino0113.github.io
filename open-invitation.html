<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jethro & Ivy Wedding Invitation</title>
    <meta name="description" content="Jethro and Ivy interactive MAIMAI wedding invitation" />
    <link rel="icon" href="data:," />
    <link rel="preload" as="image" href="assets/images/invitation/2.svg" />
    <link rel="preload" as="image" href="assets/images/invitation/1-open.svg" />
    <link rel="stylesheet" href="assets/css/maimai-invitation.css?v=android-touch-fix" />
    <link rel="stylesheet" href="assets/css/open-invitation-inner.css?v=inner-v2" />
    <link rel="stylesheet" href="assets/css/open-invitation-achievements.css?v=achievements-v1" />
    <link rel="stylesheet" href="assets/css/open-invitation-achievement-list.css?v=list-v1" />
    <link rel="stylesheet" href="assets/css/open-invitation-hotspots.css?v=eevee-hotspots-v4-center-two" />
  </head>
  <body>
    <main class="invitation-app" aria-label="Interactive MAIMAI wedding invitation">
      <canvas class="spark-canvas" id="spark-canvas" aria-hidden="true"></canvas>

      <section class="scene-shell" aria-label="Rotatable invitation scene">
        <div class="scene" id="scene">
          <article
            class="machine"
            id="machine"
            style="--yaw: 0deg; --pitch: 0deg; --open: 0; --shift: 0px; --left-slide: 100%; --right-slide: -100%; --panel-flip: 0deg; --seam-overlap: 0px; --closed-cover-opacity: 1;"
          >
            <div class="spread-shadow" aria-hidden="true"></div>

            <div class="center-inside" aria-label="Invitation center page"></div>
            <div class="center-back-closed" aria-hidden="true"></div>
            <div class="center-back-open" aria-hidden="true"></div>
            <div class="closed-front-cover" aria-hidden="true" style="opacity: 1; visibility: visible;"></div>
            <button class="pull-panel pull-left" type="button" data-door="left" aria-label="Drag the left pull page open">
              <span class="pull-face" aria-hidden="true"></span>
              <span class="pull-grip" aria-hidden="true"></span>
            </button>
            <button class="pull-panel pull-right" type="button" data-door="right" aria-label="Drag the right pull page open">
              <span class="pull-face" aria-hidden="true"></span>
              <span class="pull-grip" aria-hidden="true"></span>
            </button>
            <div class="center-cover" aria-label="MAIMAI front page"></div>

            <div class="outer-eevee-hotspot-layer outer-eevee-front-layer" aria-label="外頁伊布">
              <button
                class="outer-eevee-hotspot outer-eevee-front-left"
                type="button"
                data-hotspot-id="outer-eevee-left"
                data-hotspot-kind="eevee"
                data-hotspot-surface="front-closed"
                data-hotspot-scope="outer"
                aria-label="點擊左側外頁伊布"
              ></button>
              <button
                class="outer-eevee-hotspot outer-eevee-front-right"
                type="button"
                data-hotspot-id="outer-eevee-right"
                data-hotspot-kind="eevee"
                data-hotspot-surface="front-closed"
                data-hotspot-scope="outer"
                aria-label="點擊右側外頁伊布"
              ></button>
            </div>

            <div class="coin-slot-hotspot-layer" aria-label="投幣孔">
              <button
                class="coin-slot-hotspot"
                type="button"
                data-hotspot-id="coin-slot"
                data-hotspot-kind="coin-slot"
                data-hotspot-surface="front-closed"
                aria-label="點擊投幣孔"
              ></button>
            </div>

            <div class="outer-eevee-hotspot-layer outer-eevee-back-closed-layer" aria-label="外頁伊布背面">
              <button
                class="outer-eevee-hotspot outer-eevee-back-center-brown"
                type="button"
                data-hotspot-id="outer-eevee-center-brown"
                data-hotspot-kind="eevee"
                data-hotspot-surface="back-closed"
                data-hotspot-scope="outer"
                aria-label="點擊中間外頁伊布"
              ></button>
              <button
                class="outer-eevee-hotspot outer-eevee-back-center-glaceon"
                type="button"
                data-hotspot-id="outer-eevee-center-glaceon"
                data-hotspot-kind="eevee"
                data-hotspot-surface="back-closed"
                data-hotspot-scope="outer"
                aria-label="點擊中央冰伊布"
              ></button>
            </div>

            <div class="outer-eevee-hotspot-layer outer-eevee-back-open-layer" aria-label="外頁伊布背面展開">
              <button
                class="outer-eevee-hotspot outer-eevee-back-left"
                type="button"
                data-hotspot-id="outer-eevee-left"
                data-hotspot-kind="eevee"
                data-hotspot-surface="back-open"
                data-hotspot-scope="outer"
                aria-label="點擊左側外頁伊布"
              ></button>
              <button
                class="outer-eevee-hotspot outer-eevee-back-center-open-brown"
                type="button"
                data-hotspot-id="outer-eevee-center-brown"
                data-hotspot-kind="eevee"
                data-hotspot-surface="back-open"
                data-hotspot-scope="outer"
                aria-label="點擊中間外頁伊布"
              ></button>
              <button
                class="outer-eevee-hotspot outer-eevee-back-center-open-glaceon"
                type="button"
                data-hotspot-id="outer-eevee-center-glaceon"
                data-hotspot-kind="eevee"
                data-hotspot-surface="back-open"
                data-hotspot-scope="outer"
                aria-label="點擊中央冰伊布"
              ></button>
              <button
                class="outer-eevee-hotspot outer-eevee-back-right"
                type="button"
                data-hotspot-id="outer-eevee-right"
                data-hotspot-kind="eevee"
                data-hotspot-surface="back-open"
                data-hotspot-scope="outer"
                aria-label="點擊右側外頁伊布"
              ></button>
              <button
                class="outer-eevee-hotspot outer-eevee-back-tail-left"
                type="button"
                data-hotspot-id="outer-eevee-tail-left"
                data-hotspot-kind="eevee-tail"
                data-hotspot-surface="back-open"
                data-hotspot-scope="outer"
                aria-label="點擊左側伊布尾巴"
              ></button>
              <button
                class="outer-eevee-hotspot outer-eevee-back-tail-right"
                type="button"
                data-hotspot-id="outer-eevee-tail-right"
                data-hotspot-kind="eevee-tail"
                data-hotspot-surface="back-open"
                data-hotspot-scope="outer"
                aria-label="點擊右側伊布尾巴"
              ></button>
            </div>

            <div class="inner-eevee-hotspot-layer" aria-label="內頁伊布">
              <button
                class="inner-eevee-hotspot"
                type="button"
                data-hotspot-id="inner-eevee"
                data-hotspot-kind="eevee"
                data-hotspot-surface="inner-open"
                data-hotspot-scope="inner"
                aria-label="點擊內頁伊布"
              ></button>
            </div>
          </article>
        </div>
      </section>

      <div class="orientation-hint" id="orientation-hint" role="status" aria-live="polite" hidden>
        <strong>建議旋轉螢幕</strong>
        <span>橫向觀看較完整，手機可用雙指移動與縮放。</span>
      </div>

      <aside class="hud" aria-label="Invitation controls">
        <button
          class="hud-toggle"
          type="button"
          id="toggle-hud"
          aria-expanded="true"
          aria-controls="hud-content"
        >
          收合
        </button>
        <div class="hud-content" id="hud-content">
          <div class="hud-row">
            <span class="hud-label">單指拖曳</span>
            <strong>旋轉喜帖</strong>
          </div>
          <div class="hud-row">
            <span class="hud-label">左右拖曳</span>
            <strong>拉開折頁</strong>
          </div>
          <div class="hud-row">
            <span class="hud-label">雙指手勢</span>
            <strong>移動 / 縮放</strong>
          </div>
          <div class="hud-actions">
            <button type="button" id="toggle-open">打開</button>
            <button type="button" id="reset-view">重置</button>
          </div>
          <button
            class="achievement-launcher"
            type="button"
            id="toggle-achievements"
            aria-expanded="false"
            aria-controls="achievement-panel"
          >
            <span>成就列表</span>
            <strong id="achievement-progress">0 / 12</strong>
          </button>
        </div>
      </aside>
    </main>

    <aside
      class="achievement-panel"
      id="achievement-panel"
      aria-labelledby="achievement-panel-title"
      hidden
    >
      <div class="achievement-panel-header">
        <div>
          <span class="achievement-panel-kicker">PUBLIC SERVER</span>
          <h2 id="achievement-panel-title">成就列表</h2>
        </div>
        <button class="achievement-panel-close" type="button" id="close-achievements">
          關閉
        </button>
      </div>
      <p class="achievement-panel-summary" id="achievement-panel-summary">
        探索喜帖，解鎖全部秘密。
      </p>
      <ol class="achievement-list" id="achievement-list"></ol>
    </aside>

    <div
      class="achievement-toast-region"
      id="achievement-toast-region"
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <script defer src="assets/js/open-invitation.js?v=achievements-v9-five-eevee"></script>
    <script defer src="assets/js/maimai-invitation.js?v=android-touch-fix-v3-hotspot-clicks"></script>
  </body>
</html>
